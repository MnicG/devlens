[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "devlens"
version = "0.1.0"
description = "DevLens Evidence Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "GitPython==3.2.1",
    "langgraph==1.2.20",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "pre-commit>=3.7,<5",
    "pip-audit>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
